name: P0 regressions and P1 offline contracts
on:
  push:
    branches: [main, 'codex/p0-*', 'codex/p1-*']
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/QrGuard.Contracts/QrGuard.Contracts.csproj --locked-mode
      - run: dotnet build tests/QrGuard.Contracts/QrGuard.Contracts.csproj -c Release --no-restore
      - run: dotnet run --project tests/QrGuard.Contracts -c Release --no-build --no-restore
      - run: dotnet restore tests/QrGuard.P1.Contracts/QrGuard.P1.Contracts.csproj --locked-mode
      - run: dotnet build tests/QrGuard.P1.Contracts/QrGuard.P1.Contracts.csproj -c Release --no-restore
      - run: dotnet run --project tests/QrGuard.P1.Contracts -c Release --no-build --no-restore
      - run: dotnet restore src/QrGuard.Windows/QrGuard.Windows.csproj --locked-mode
      - run: dotnet build src/QrGuard.Windows/QrGuard.Windows.csproj -c Release --no-restore
      - run: dotnet restore tests/QrGuard.Windows.Contracts/QrGuard.Windows.Contracts.csproj --locked-mode
      - run: dotnet build tests/QrGuard.Windows.Contracts/QrGuard.Windows.Contracts.csproj -c Release --no-restore
      - name: PowerShell harness syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/run-p0.ps1', 'scripts/run-p1.ps1', 'scripts/collect-p0-environment.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse failed for $file" }
          }
      - name: Windows mask API contracts
        if: runner.os == 'Windows'
        run: dotnet run --project tests/QrGuard.Windows.Contracts -c Release --no-build --no-restore
      # Hosted API contracts do not establish Windows workstation capture, input or phone acceptance.
